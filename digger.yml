generate_projects:
  blocks:
    - block_name: global
      root_dir: "infra/_global/"
      workflow: default
      include: "**"
    - block_name: dev
      root_dir: "infra/dev/"
      workflow: default
      include: "**"
  drift_exclude_blocks:
    - global
reporting:
  ai_summary: true
workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - init
        - apply
pr_locks: false
