generate_projects:
  blocks:
    - block_name: global
      workflow: default
      include: "infra/_global/**"
    - block_name: dev
      workflow: default
      include: "infra/dev/**"
  drift_exclude_blocks:
    - global
reporting:
  ai_summary: true
workflows:
  default:
    plan:
      steps:
        - init
        - plan
    apply:
      steps:
        - init
        - apply
pr_locks: false
