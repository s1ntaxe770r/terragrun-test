# Reproduces diggerhq/digger "git command timed out after 30s" during the policy check of a
# backend-orchestrated (spec / drift) run, on a runner whose inbound traffic from GitHub is
# throttled with tc so a small management repo clones slowly and predictably.
#
# One job, same drift-shaped spec, two binaries back to back:
#   shipped <shipped_version>   expected: "git command timed out after 30s" (spec git_timeout ignored)
#   fixed   <fixed_ref>         expected: clone finishes within git_timeout, policy check passes, plan runs
# Both binaries are the EE CLI (the management-repo policy provider only exists there), so the
# repo needs a DIGGER_LICENSE_KEY secret. tc shaping is attempted first but GitHub-hosted runners
# carry a clsact BPF filter (tc_ingress_traffic) that pre-empts it, so the proxy fallback is what works there.
name: git_timeout e2e (throttled runner)

on:
  workflow_dispatch:
    inputs:
      rate_kbit:
        description: "Inbound bandwidth from GitHub git endpoints in kbit/s (0 with delay_ms=0 = no throttle, e.g. for the heavy repo)"
        default: "150"
      delay_ms:
        description: "Added one-way delay on inbound packets from GitHub git endpoints, in ms"
        default: "200"
      git_timeout:
        description: "git_timeout (seconds) carried in the spec's policy_provider"
        default: "120"
      management_repo:
        description: "DIGGER_MANAGEMENT_REPO the policy check clones"
        default: "https://github.com/s1ntaxe770r/digger-small-management-repo"
      fixed_ref:
        description: "s1ntaxe770r/digger ref to build the fixed EE CLI from"
        default: "fix/spec-git-timeout"
      shipped_version:
        description: "Released CLI to compare against"
        default: "v0.6.152"
      cli_flavor:
        description: "oss (cli/, digger-cli-*) or ee (ee/cli, digger-ee-cli-*, needs DIGGER_LICENSE_KEY)"
        default: "oss"

run-name: "git_timeout e2e (${{ inputs.cli_flavor }}): rate=${{ inputs.rate_kbit }}kbit delay=${{ inputs.delay_ms }}ms git_timeout=${{ inputs.git_timeout }}s"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build the fixed ${{ inputs.cli_flavor }} CLI from s1ntaxe770r/digger@${{ inputs.fixed_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ inputs.fixed_ref }}" https://github.com/s1ntaxe770r/digger.git "$RUNNER_TEMP/digger-src"
          if [ "${{ inputs.cli_flavor }}" = "ee" ]; then cd "$RUNNER_TEMP/digger-src/ee/cli"; else cd "$RUNNER_TEMP/digger-src/cli"; fi
          go build -o "$RUNNER_TEMP/digger-fixed" ./cmd/digger
          echo "fixed CLI built from $(git rev-parse --short HEAD)"

      - name: Download the shipped ${{ inputs.cli_flavor }} CLI ${{ inputs.shipped_version }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.cli_flavor }}" = "ee" ]; then asset=digger-ee-cli-linux-amd64; else asset=digger-cli-linux-amd64; fi
          echo "downloading $asset"
          curl -fsSL -o "$RUNNER_TEMP/digger-shipped" \
            "https://github.com/diggerhq/digger/releases/download/${{ inputs.shipped_version }}/$asset"
          chmod +x "$RUNNER_TEMP/digger-shipped"

      - name: Build the drift-shaped spec (what drift/controllers/drift.go dispatches)
        run: |
          set -euo pipefail
          jq -cn --argjson gt "${{ inputs.git_timeout }}" '{
            job_id: "git-timeout-e2e", comment_id: "", run_name: "git_timeout e2e",
            job: {
              job_type: "plan", projectName: "dev-my-project", projectDir: "infra/dev/my-project", projectWorkspace: "default",
              terragrunt: false, opentofu: false, pulumi: false,
              commands: ["digger plan"],
              applyStage: {steps: [{action: "init"}, {action: "apply"}]},
              planStage: {steps: [{action: "init"}, {action: "plan"}]},
              pullRequestNumber: 0, commit: "", branch: "main", eventName: "drift", requestedBy: "digger",
              namespace: "s1ntaxe770r/terragrun-test",
              runEnvVars: {DEFAULT_BRANCH: "main", PR_BRANCH: "main", PROJECT_NAME: "dev-my-project", PROJECT_DIR: "infra/dev/my-project"},
              stateEnvVars: {}, commandEnvVars: {},
              backend_hostname: "", backend_organisation_hostname: "", backend_job_token: ""
            },
            reporter: {reporter_type: "noop", reporting_strategy: "noop", report_terraform_output: true},
            comment_updater: {comment_updater_type: "noop"},
            lock: {lock_type: "noop"},
            backend: {backend_type: "noop"},
            vcs: {vcs_type: "noop", actor: "digger", repo_full_name: "s1ntaxe770r/terragrun-test", repo_owner: "s1ntaxe770r", repo_name: "terragrun-test", workflow_file: "digger_workflow.yml"},
            policy_provider: {policy_type: "http", git_timeout: $gt},
            variables: []
          }' > "$RUNNER_TEMP/spec.json"
          echo "DIGGER_RUN_SPEC=$(cat "$RUNNER_TEMP/spec.json")" >> "$GITHUB_ENV"
          jq . "$RUNNER_TEMP/spec.json"

      - name: Throttle inbound traffic from GitHub git endpoints (tc)
        id: tc
        if: ${{ inputs.rate_kbit != '0' || inputs.delay_ms != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RATE_KBIT: ${{ inputs.rate_kbit }}
          DELAY_MS: ${{ inputs.delay_ms }}
        run: |
          set -uo pipefail
          IF=$(ip route get 140.82.112.3 | awk '{for (i = 1; i <= NF; i++) if ($i == "dev") print $(i + 1); exit}')
          mapfile -t CIDRS < <(gh api meta --jq '.git[]' | grep -v ':')
          NETEM="limit 100000 delay ${DELAY_MS}ms"
          if [ "$RATE_KBIT" != "0" ]; then NETEM="$NETEM rate ${RATE_KBIT}kbit"; fi
          echo "qdiscs on $IF before:"; tc qdisc show dev "$IF"
          echo "ingress filters on $IF before:"; tc filter show dev "$IF" ingress || true
          shape() {
            sudo modprobe ifb numifbs=1 || return 1
            sudo ip link set ifb0 up || return 1
            # the runner image already has a clsact qdisc with a pref-1 filter on eth0: attach to it
            # (a second ingress qdisc fails with "Exclusivity flag on", prio 1 with "Protocol mismatch")
            if tc qdisc show dev "$IF" | grep -q 'qdisc clsact'; then PARENT="ffff:fff2"
            elif tc qdisc show dev "$IF" | grep -q 'qdisc ingress'; then PARENT="ffff:"
            else sudo tc qdisc add dev "$IF" handle ffff: ingress || return 1; PARENT="ffff:"; fi
            PRIO=4000
            while tc filter show dev "$IF" ingress | grep -q "pref $PRIO "; do PRIO=$((PRIO + 1)); done
            for cidr in "${CIDRS[@]}"; do
              sudo tc filter add dev "$IF" parent "$PARENT" protocol ip prio "$PRIO" u32 match ip src "$cidr" \
                action mirred egress redirect dev ifb0 || return 1
            done
            sudo tc qdisc add dev ifb0 root netem $NETEM || return 1
          }
          if shape; then
            echo "tc: shaping inbound traffic from ${#CIDRS[@]} GitHub CIDRs on $IF via ifb0 with netem '$NETEM'"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::tc shaping failed on this runner; the proxy fallback will be used"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ingress filters on $IF after:"; tc filter show dev "$IF" ingress || true
          tc -s qdisc show dev ifb0 || true

      - name: Probe clone under tc throttle (the exact clone the policy provider runs)
        id: probe
        if: ${{ inputs.rate_kbit != '0' || inputs.delay_ms != '0' }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          timeout 900 git clone -q --depth 1 --single-branch -b main "${{ inputs.management_repo }}" "$RUNNER_TEMP/probe"
          secs=$(( $(date +%s) - start ))
          echo "probe clone took ${secs}s ($(du -sh "$RUNNER_TEMP/probe/.git" | cut -f1))"
          echo "seconds=$secs" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/probe"
          # GitHub-hosted runners carry a clsact BPF filter (tc_ingress_traffic, pref 1, direct-action)
          # that returns a verdict before any later filter runs, so the redirect to ifb0 never fires.
          # Decide on packets that actually went through ifb0, not on wall time.
          pkts=$(tc -s qdisc show dev ifb0 2>/dev/null | grep -oE 'Sent [0-9]+ bytes [0-9]+ pkt' | awk '{print $4}' || echo 0)
          echo "ifb0 saw ${pkts:-0} packets during the probe"
          if [ "${pkts:-0}" -ge 1000 ]; then echo "tc_effective=true" >> "$GITHUB_OUTPUT"; else echo "tc_effective=false" >> "$GITHUB_OUTPUT"; fi

      - name: Fallback - throttle git through a bandwidth-limited CONNECT proxy
        id: proxy
        if: ${{ (inputs.rate_kbit != '0' || inputs.delay_ms != '0') && steps.probe.outputs.tc_effective != 'true' }}
        env:
          RATE_KBIT: ${{ inputs.rate_kbit }}
        run: |
          set -euo pipefail
          rate_bps=$(( RATE_KBIT > 0 ? RATE_KBIT * 125 : 18750 ))
          nohup python3 .github/scripts/throttle_proxy.py 8118 "$rate_bps" > "$RUNNER_TEMP/proxy.log" 2>&1 &
          sleep 1
          git config --global http.proxy http://127.0.0.1:8118
          echo "git now clones through 127.0.0.1:8118 limited to ${rate_bps} B/s"
          start=$(date +%s)
          timeout 900 git clone -q --depth 1 --single-branch -b main "${{ inputs.management_repo }}" "$RUNNER_TEMP/probe2"
          secs=$(( $(date +%s) - start ))
          echo "probe clone through the proxy took ${secs}s"
          echo "seconds=$secs" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/probe2"

      - name: Run shipped ${{ inputs.shipped_version }} (expected to time out after 30s)
        id: shipped
        continue-on-error: true
        env:
          DIGGER_MANAGEMENT_REPO: ${{ inputs.management_repo }}
          DIGGER_LICENSE_KEY: ${{ secrets.DIGGER_LICENSE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGGER_LOG_LEVEL: DEBUG
          TELEMETRY: "false"
          DIGGER_OUT: ${{ runner.temp }}/digger-out-shipped.log
        run: |
          start=$(date +%s)
          set +e
          "$RUNNER_TEMP/digger-shipped" default 2>&1 | tee "$RUNNER_TEMP/shipped.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "elapsed=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "shipped CLI exit code: $rc"
          exit "$rc"

      - name: Run fixed build (expected to clone within git_timeout and pass the policy check)
        id: fixed
        continue-on-error: true
        env:
          DIGGER_MANAGEMENT_REPO: ${{ inputs.management_repo }}
          DIGGER_LICENSE_KEY: ${{ secrets.DIGGER_LICENSE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGGER_LOG_LEVEL: DEBUG
          TELEMETRY: "false"
          DIGGER_OUT: ${{ runner.temp }}/digger-out-fixed.log
        run: |
          start=$(date +%s)
          set +e
          "$RUNNER_TEMP/digger-fixed" default 2>&1 | tee "$RUNNER_TEMP/fixed.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "elapsed=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          echo "fixed CLI exit code: $rc"
          exit "$rc"

      - name: Summarize and assert
        if: always()
        env:
          PROBE_SECONDS: ${{ steps.probe.outputs.seconds }}
          TC_OK: ${{ steps.tc.outputs.ok }}
          TC_EFFECTIVE: ${{ steps.probe.outputs.tc_effective }}
          PROXY_SECONDS: ${{ steps.proxy.outputs.seconds }}
          SHIPPED_OUTCOME: ${{ steps.shipped.outcome }}
          SHIPPED_ELAPSED: ${{ steps.shipped.outputs.elapsed }}
          FIXED_OUTCOME: ${{ steps.fixed.outcome }}
          FIXED_ELAPSED: ${{ steps.fixed.outputs.elapsed }}
        run: |
          set -euo pipefail
          key() { grep -m1 -oE 'git command timed out after [0-9a-z.]+|Access policy allowed action|Access policy denied action|error while fetching access policy[^"]*|unexpected response while fetching [a-z]+ policy[^"]*|No policies will be supported' "$1" 2>/dev/null || echo "none"; }
          echo "git clones attempted by the shipped CLI: $(grep -c 'Cloning into' "$RUNNER_TEMP/shipped.log" || true); by the fixed CLI: $(grep -c 'Cloning into' "$RUNNER_TEMP/fixed.log" || true)"
          shipped_key=$(key "$RUNNER_TEMP/shipped.log")
          fixed_key=$(key "$RUNNER_TEMP/fixed.log")
          {
            echo "## git_timeout e2e on a throttled runner (${{ inputs.cli_flavor }} CLI)"
            echo ""
            echo "- management repo: ${{ inputs.management_repo }}"
            echo "- requested throttle: rate=${{ inputs.rate_kbit }} kbit/s, delay=${{ inputs.delay_ms }} ms; tc installed=${TC_OK:-?} effective=${TC_EFFECTIVE:-?}; probe depth-1 clone took ${PROBE_SECONDS:-?}s under tc${PROXY_SECONDS:+, then ${PROXY_SECONDS}s through the proxy fallback} (Digger default git_timeout is 30s)"
            echo "- spec policy_provider.git_timeout: ${{ inputs.git_timeout }}s"
            echo ""
            echo "| ${{ inputs.cli_flavor }} CLI | outcome | elapsed | key log line |"
            echo "|---|---|---|---|"
            echo "| shipped ${{ inputs.shipped_version }} | ${SHIPPED_OUTCOME} | ${SHIPPED_ELAPSED:-?}s | ${shipped_key} |"
            echo "| fixed s1ntaxe770r/digger@${{ inputs.fixed_ref }} | ${FIXED_OUTCOME} | ${FIXED_ELAPSED:-?}s | ${fixed_key} |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.cli_flavor }}" != "ee" ]; then
            echo "oss flavor: no timeout expectations, the table above is the result"; exit 0
          fi
          if [ "$shipped_key" != "git command timed out after 30s" ]; then
            echo "::error::expected the shipped CLI to time out after 30s, got: $shipped_key"; exit 1
          fi
          if [ "$fixed_key" != "Access policy allowed action" ]; then
            echo "::error::expected the fixed CLI to clone within git_timeout and pass the policy check, got: $fixed_key"; exit 1
          fi
          if [ "$FIXED_OUTCOME" != "success" ]; then
            echo "::warning::fixed CLI passed the policy check but the rest of the job failed; see its step log"
          fi
