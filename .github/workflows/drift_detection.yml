name: Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "50 0 * * *" # 1:50 AM WAT (UTC+1)

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
      statuses: write
    env:
      TERRAGRUNT_PARALLELISM: "20"
      TG_PARALLELISM: "20"
    steps:
      - uses: actions/checkout@v4
      - name: verify terragrunt parallelism env vars are set
        run: |
          echo "TERRAGRUNT_PARALLELISM=${TERRAGRUNT_PARALLELISM:?TERRAGRUNT_PARALLELISM is not set}"
          echo "TG_PARALLELISM=${TG_PARALLELISM:?TG_PARALLELISM is not set}"
      - name: digger drift detection
        uses: s1ntaxe770r/digger@feat/terragrunt-parallelism
        with:
          mode: drift-detection
          no-backend: true
          setup-terraform: true
          setup-terragrunt: true
          disable-locking: true
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRIFT_GITHUB_ISSUES: "true"
