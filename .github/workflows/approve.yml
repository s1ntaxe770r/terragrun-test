name: approve
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to approve
        required: true
permissions:
  pull-requests: write
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve the PR as github-actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: gh pr review "$PR" --approve --body "LGTM - approval by github-actions bot for the pagination repro" -R "$GITHUB_REPOSITORY"
